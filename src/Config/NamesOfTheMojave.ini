[General]
; 1 = the mod names NPCs. 0 = off: NPCs this mod named get their original names back.
Enabled=1
; 1 = show the original role after the name, e.g. "Mike Dawson (Powder Ganger)". 0 = name only.
ShowRole=0
; Seconds between scans for newly spawned actors. Minimum 1.
ScanInterval=10
; 1 = ranks the game uses go before a name, e.g. "Ranger Barker". 0 = a first name instead of the rank, same surname (if the pool has surnames), e.g. "Erik Barker".
UseTitles=1
