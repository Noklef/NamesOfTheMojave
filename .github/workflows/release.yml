name: Build and release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0)"
        required: true
        default: "1.0"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build package and create release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_VERSION:-$GITHUB_REF_NAME}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version such as 1.0 or 1.1 (major.minor)."
            exit 1
          fi

          python scripts/build.py "$version"
          package="dist/NamesOfTheMojave-${version}.zip"
          mv dist/NamesOfTheMojave.zip "$package"

          gh release create "${version}" "$package" \
            --target "$GITHUB_SHA" \
            --title "Names of the Mojave - ${version}" \
            --generate-notes
