name: Release mod
run-name: Release ${{ inputs.version && format('NotM-{0}', inputs.version) || github.ref_name }}

on:
  push:
    tags:
      - "NotM-[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0)"
        required: true
        default: "1.0"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build package and create release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_VERSION:-${GITHUB_REF_NAME#NotM-}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version such as 1.0 or 1.1 (major.minor)."
            exit 1
          fi

          python scripts/build.py "$version"
          package="dist/NamesOfTheMojave_${version}.zip"
          mv dist/NamesOfTheMojave.zip "$package"
          ini_package="dist/NamesOfTheMojave_INI_${version}.zip"
          mv dist/NamesOfTheMojave-INI.zip "$ini_package"

          gh release create "NotM-${version}" "$package" "$ini_package" \
            --target "$GITHUB_SHA" \
            --title "Names of the Mojave - ${version}" \
            --generate-notes
